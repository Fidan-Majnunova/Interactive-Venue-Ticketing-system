<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Venue Ticketing System</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header class="site-header">
        <h1>Interactive Venue Ticketing System</h1>
    </header>

    <main class="layout">
        <section id="map-section">
            <h2 id="map-title">The venue</h2>

            <div id="legend"></div>

            <div id="controls">
                <div id="zoom-buttons">
                    <button id="zoom-in" type="button" title="Zoom In">+</button>
                    <button id="zoom-out" type="button" title="Zoom Out">−</button>
                </div>

                <div id="pad">
                    <button id="move-up" type="button" title="Move Up">↑</button>
                    <button id="move-left" type="button" title="Move Left">←</button>
                    <button id="reset-view" type="button" title="Reset View">●</button>
                    <button id="move-right" type="button" title="Move Right">→</button>
                    <button id="move-down" type="button" title="Move Down">↓</button>
                </div>
            </div>

            <div id="map-viewport">
                <div id="map"></div>
            </div>
        </section>

        <section id="details-section">
            <h2>Seat details</h2>
            <div id="seat-info">
                <p>Select a seat on the map</p>
            </div>
            <button id="add-to-cart" type="button">Add to CART</button>
        </section>

        <section id="cart-section">
            <h2>Your cart</h2>
            <ul id="cart-items"></ul>
            <p>Total: <strong id="cart-total">0 ₼</strong></p>
        </section>
    </main>

    <footer class="footer">
        <p>Interactive Venue Ticketing System | WM1 Project</p>
    </footer>

    <script src="javascript/data.js"></script>
    <script src="javascript/venue.js"></script>
</body>
</html>
